[build-system]
requires = ["setuptools>=61.0"]
# 【QC修复】使用现代 PEP 517 标准构建后端，抛弃 legacy 遗留模式
build-backend = "setuptools.build_meta"

[project]
name = "nesttidy"
version = "1.2.0"
description = "理巢 — 智能目录重构工具 (Windows 10/11)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "tqdm>=4.65.0",
    "colorama>=0.4.6",
    "jinja2>=3.1.0",
    # ⚠️ 警告确认：如果 runtime/config.py 在 Python 3.9/3.10 下依赖了 tomli，请在此处加上 "tomli>=2.0.0; python_version<'3.11'"
]

[project.scripts]
nesttidy = "nesttidy.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nesttidy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
