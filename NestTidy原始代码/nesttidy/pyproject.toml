[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "nesttidy"
version = "1.2.0"
description = "理巢 — 智能目录重构工具 (Windows 10/11)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "tqdm>=4.65.0",
    "colorama>=0.4.6",
    "jinja2>=3.1.0",
]

[project.scripts]
nesttidy = "nesttidy.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nesttidy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
