name: Windows regression

on:
  push:
    branches:
      - main
      - 'fix/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run standard-library regression suite
        run: python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install development-only linter
        run: python -m pip install ruff==0.11.13
      - name: Check syntax and Python names/imports
        run: python -m ruff check --select E9,F nesttidy tests benchmarks packaging
